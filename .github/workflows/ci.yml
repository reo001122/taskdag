name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc に合わせる。node:sqlite を使うため 22.5 未満では動かない
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run check

      - name: Test
        run: npm test

  # 実機を操作する確認(tools/ui-probe/)。Electron を起動するため画面が要る。
  # Linux ランナーには無いので xvfb を被せる。
  #
  # **まだ CI 上で走ったことがないため、当面は落ちても全体を止めない。**
  # 落ちたときに「アプリの不具合」と「CI 環境の問題」を切り分けられないうちに
  # 必須にすると、最初の数回で信用を失う。通ることを何度か確認してから
  # continue-on-error を外し、必須の検査にする。
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    # 手元では20秒で終わる。止まったまま既定の6時間を回さないための上限。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Chromium のサンドボックス補助バイナリは root 所有 + setuid でないと動かず、
      # そうでない場合 Electron は起動せずに落ちる(サンドボックス無しで動くより
      # 止まるほうを選ぶ)。npm ci で展開した直後は runner ユーザーの所有になっている。
      #
      # --no-sandbox を渡して回避しない。利用者の手元と違う構成でアプリを動かすと、
      # probe が確かめている「実際に起きること」の意味が薄れる。
      - name: Let Electron use its sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      # --show-window を渡す。既定では画面に出さないが、出さないままだと
      # ウィンドウが一度も合成されず、フレームが進まない。requestAnimationFrame が
      # 発火しないため、入力欄へのフォーカス(rAF で再試行している)が移らず、
      # 接続のドラッグも取りこぼし、Page.captureScreenshot は応答を返さない。
      #
      # 手元で隠しているのは、コミットのたびに画面が割り込まないようにするため。
      # CI には割り込まれる人がいないので、出して構わない。実際の使われ方にも近い。
      - name: Drive the app
        run: xvfb-run -a npm run probe -- --show-window

      - name: Keep the screen from a failed scenario
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-probe-screens
          path: ui-probe-*.png
          if-no-files-found: ignore
